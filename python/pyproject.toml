[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-nexus-openai-batch"
version = "0.1.0"
description = "PostgreSQL-backed OpenAI batching through Temporal Nexus standalone Activities"
requires-python = ">=3.11"
dependencies = [
    "temporalio==1.33.0",
    "asyncpg>=0.30,<1",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
batchctl-python = "nexus_batch.cli:main"

[tool.setuptools.package-data]
nexus_batch = ["schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires local PostgreSQL and Temporal"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
