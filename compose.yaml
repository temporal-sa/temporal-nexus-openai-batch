name: nexus-batch-prototype
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nexus_batch
      POSTGRES_PASSWORD: nexus_batch
      POSTGRES_DB: nexus_batch
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_batch -d nexus_batch"]
      interval: 1s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  postgres_data:
